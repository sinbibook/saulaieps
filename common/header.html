<header id="header" class="header">
  <div class="hd_cont">
    <div class="hd_inner">
      <div class="logo">
        <!-- data-* 속성 : data-logo -->
        <a href="./index.html">
          <img data-logo alt="로고" />
        </a>
      </div>
      <div class="hd_lnb" id="hd_lnb">
        <ul class="hd_lnb01">
          <li class="depth1">
            <a href="./main.html" class="depth1_a">ABOUT</a>
            <ul class="depth_box">
              <li><a href="./main.html">펜션소개</a></li>
            </ul>
          </li>
          <li class="depth1">
            <!-- data-* 속성 : data-rooms-link (layoutMap 켜짐 → layout-map.html / 꺼짐 → 첫 객실 상세) -->
            <a href="./layout-map.html" class="depth1_a" data-rooms-link>ROOMS</a>
            <!-- data-* 속성 : data-rooms-submenu (ROOMS 서브메뉴 컨테이너) -->
            <ul class="depth_box" data-rooms-submenu>
              <!-- data-* 속성 : data-room-menu-link (객실 목록 링크 / 동적 생성 앵커), data-menu-id="layout-map" (layoutMap enabled 토글) -->
              <li data-menu-id="layout-map"><a href="./layout-map.html" data-room-menu-link>미리보기</a></li>
              <!-- MAPPER: roomtypes[].name 동적 생성 -->
            </ul>
          </li>
          <li class="depth1">
            <a href="./facility.html" class="depth1_a">SPECIAL</a>
            <!-- data-* 속성 : data-facility-menu-link (SPECIAL 서브메뉴 컨테이너) -->
            <ul class="depth_box" data-facility-menu-link>
              <!-- MAPPER: facilities[].name 동적 생성 -->
            </ul>
          </li>
        </ul>
        <ul class="hd_lnb02">
          <li class="depth1">
            <a href="#!" class="depth1_a" target="_blank" data-booking-link>RESERVE</a>
            <ul class="depth_box">
              <!-- data-* 속성 : data-booking-link (예약하기 / property.realtimeBookingId) -->
              <li><a href="#!" target="_blank" data-booking-link>예약하기</a></li>
              <li><a href="./reservation.html">이용안내</a></li>
            </ul>
          </li>
          <!-- data-* 속성 : data-travel-menu (nearbyAttractions enabled 토글) -->
          <li class="depth1" data-travel-menu>
            <a href="./nearby-attractions.html" class="depth1_a">TRAVEL</a>
            <!-- data-* 속성 : data-travel-submenu -->
            <ul class="depth_box" data-travel-submenu>
              <!-- data-* 속성 : data-menu-id="nearby-attractions" -->
              <li>
                <a href="./nearby-attractions.html" data-menu-id="nearby-attractions">주변여행지</a>
              </li>
            </ul>
          </li>
          <li class="depth1">
            <a href="./directions.html" class="depth1_a">LOCATION</a>
            <ul class="depth_box">
              <li><a href="./directions.html">오시는길</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
    <!--// hd_inner -->
    <div class="btn_hd_res">
      <!-- data-* 속성 : data-booking-link -->
      <a href="#!" target="_blank" data-booking-link>
        <img src="images/reservation_btn.png" class="for_pc" />
        <img src="images/reservation_btn2.png" class="for_t" />
      </a>
    </div>
    <!-- 네이버·인스타그램 (641px 이상: 예약 아이콘 왼쪽 / 640px 이하는 aside 메뉴 아래로)
         data-* 속성 : data-homepage-socialLinks-blog (네이버 ← homepage.socialLinks.blog)
         data-homepage-socialLinks-instagram (인스타그램 ← homepage.socialLinks.instagram)
         값 없으면 버튼 숨김, 둘 다 없으면 래퍼(data-social-wrap)째 숨김. 매핑 전에는 숨김. -->
    <div class="hd_sns" data-social-wrap style="display: none">
      <a
        href="#!"
        class="btn_naver"
        target="_blank"
        rel="noopener"
        aria-label="네이버"
        style="display: none"
        data-homepage-socialLinks-blog
      >
        <img src="images/n_logo.png" alt="네이버" />
      </a>
      <a
        href="#!"
        class="btn_insta"
        target="_blank"
        rel="noopener"
        aria-label="인스타그램"
        style="display: none"
        data-homepage-socialLinks-instagram
      >
        <img src="images/insta_logo.png" alt="인스타그램" />
      </a>
    </div>
    <div class="btn_menu">
      <img src="images/menu_btn2.png" alt="메뉴버튼" />
    </div>
  </div>
  <div class="hd_lnb_bg"></div>
  <div class="aside">
    <div class="aisde_inner">
      <a
        href="#"
        class="btn_close"
        style="background-image: url(images/close.png)"
        alt="닫기버튼"
      ></a>
      <div class="aside_box">
        <div class="depth1">ABOUT</div>
        <ul class="depth_list">
          <li><a href="./main.html">펜션소개</a></li>
        </ul>
        <div class="depth1">ROOMS</div>
        <!-- data-* 속성 : data-rooms-submenu (모바일 ROOMS 서브메뉴 컨테이너) -->
        <ul class="depth_list" data-rooms-submenu>
          <!-- data-* 속성 : data-room-menu-link (동적 생성 앵커), data-menu-id="layout-map" (layoutMap enabled 토글) -->
          <li data-menu-id="layout-map"><a href="./layout-map.html" data-room-menu-link>미리보기</a></li>
          <!-- MAPPER: roomtypes[].name 동적 생성 -->
        </ul>
        <div class="depth1">SPECIAL</div>
        <!-- data-* 속성 : data-facility-menu-link (모바일 SPECIAL 서브메뉴 컨테이너) -->
        <ul class="depth_list" data-facility-menu-link>
          <!-- MAPPER: facilities[].name 동적 생성 -->
        </ul>
        <div class="depth1">RESERVE</div>
        <ul class="depth_list">
          <!-- data-* 속성 : data-booking-link -->
          <li><a href="#!" target="_blank" data-booking-link>예약하기</a></li>
          <li><a href="./reservation.html">이용안내</a></li>
        </ul>
        <!-- data-* 속성 : data-travel-menu (모바일 TRAVEL 토글) -->
        <div class="depth1" data-travel-menu>TRAVEL</div>
        <ul class="depth_list" data-travel-menu>
          <!-- data-* 속성 : data-menu-id="nearby-attractions" -->
          <li>
            <a href="./nearby-attractions.html" data-menu-id="nearby-attractions">주변여행지</a>
          </li>
        </ul>
        <div class="depth1">LOCATION</div>
        <ul class="depth_list">
          <li><a href="./directions.html">오시는길</a></li>
        </ul>
        <!-- 네이버·인스타그램 (640px 이하에서만 — 헤더에선 가운데 로고와 겹쳐서 여기로 옮긴다)
             data-* 속성 : data-homepage-socialLinks-blog / data-homepage-socialLinks-instagram (헤더와 동일) -->
        <div class="aside_sns" data-social-wrap style="display: none">
          <a
            href="#!"
            class="btn_naver"
            target="_blank"
            rel="noopener"
            aria-label="네이버"
            style="display: none"
            data-homepage-socialLinks-blog
          >
            <img src="images/n_logo.png" alt="네이버" />
          </a>
          <a
            href="#!"
            class="btn_insta"
            target="_blank"
            rel="noopener"
            aria-label="인스타그램"
            style="display: none"
            data-homepage-socialLinks-instagram
          >
            <img src="images/insta_logo.png" alt="인스타그램" />
          </a>
        </div>
      </div>
    </div>
  </div>
  <!--// aside -->
</header>
