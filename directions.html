    <!-- 렌더 게이트: 매핑 전 placeholder/fallback 깜빡임 방지 (매핑 완료 시 페이드인) -->
    <style>
      html.tpl-loading body {
        opacity: 0;
      }
      body {
        opacity: 1;
        transition: opacity 0.3s ease;
      }
    </style>
    <script>
      document.documentElement.classList.add('tpl-loading');
      window.__tplReveal = function () {
        document.documentElement.classList.remove('tpl-loading');
      };
      setTimeout(function () {
        window.__tplReveal && window.__tplReveal();
      }, 3000);
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />

    <link rel="stylesheet" type="text/css" href="styles/common.css" />

      rel="stylesheet"
      type="text/css"
      href="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css"
    />

  <body oncontextmenu="return false;" onselectstart="return false" ondragstart="return false;">
    <div id="wrap">
      <div id="header-wrap"></div>

      <div id="container">
        <section id="content" class="sub6_1 sub_traffic">
          <!-- data-* 속성 : data-directions-hero-image -->
          <div class="sub_visual" data-directions-hero-image>
            <div class="txt_box">
              <h3>TRAFFIC</h3>
              <!-- data-* 속성 : data-property-name -->
              <p>
                <span data-property-name></span>
                , 오시는길
              </p>
            </div>
          </div>
          <div class="sub_cate_wrap">
            <div class="sub_inner">
              <ul>
                <li class="on"><a href="./directions.html">오시는길</a></li>
              </ul>
            </div>
          </div>
          <div class="sub_cont">
            <div class="title_box">
              <!-- data-* 속성 : data-property-name-en -->
              <span class="logo_txt" data-property-name-en></span>
              <h3>Traffic Info</h3>
            </div>
            <div class="map">
              <!-- data-* 속성 : #kakao-map (property.latitude, property.longitude - 카카오맵 SDK 마커 매핑) -->
              <!-- lat/long 값 없을 때도 지도 영역 인지되도록 배경색 지정 (지도 렌더 시 타일이 덮음) -->
              <div
                id="kakao-map"
                style="width: 100%; height: 360px; background-color: #f0f0f0"
              ></div>
            </div>
            <div class="map_info">
              <!-- data-* 속성 : data-property-address ("주소 : " 정적 + property.address) -->
              <strong data-property-address></strong>
              <dl>
                <!-- data-* 속성 : data-directions-notice-title -->
                <dt data-directions-notice-title></dt>
                <!-- data-* 속성 : data-directions-notice-content -->
                <dd data-directions-notice-content></dd>
              </dl>
            </div>
          </div>
        </section>
      </div>
      <div id="footer-wrap"></div>
    </div>

    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>

    <script src="js/header-footer-loader.js"></script>
    <script src="js/common.js"></script>
