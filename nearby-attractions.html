<!doctype html>

    <meta charset="UTF-8" />
    <!-- 렌더 게이트: 매핑 전 placeholder/fallback 깜빡임 방지 (매핑 완료 시 페이드인) -->
    <style>
      html.tpl-loading body {
        opacity: 0;
      }
      body {
        opacity: 1;
        transition: opacity 0.3s ease;
      }
    </style>
    <script>
      document.documentElement.classList.add('tpl-loading');
      window.__tplReveal = function () {
        document.documentElement.classList.remove('tpl-loading');
      };
      setTimeout(function () {
        window.__tplReveal && window.__tplReveal();
      }, 3000);
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <body oncontextmenu="return false;" onselectstart="return false" ondragstart="return false;">
    <div id="wrap">
      <div id="header-wrap"></div>

      <div id="container">
        <section id="content" class="sub5_1 sub_travel">
          <!-- data-* 속성 : data-nearby-hero-image -->
          <div class="sub_visual" data-nearby-hero-image>
            <div class="txt_box">
              <h3>TRAVEL</h3>
              <!-- data-* 속성 : data-property-name -->
              <p>
                <span data-property-name></span>

          </div>
          <div class="sub_cate_wrap">

              </ul>
            </div>
          </div>
          <div class="sub_cont inner">
            <div class="title_box">
              <!-- data-* 속성 : data-property-name-en -->
              <span class="logo_txt" data-property-name-en></span>
              <h3>Travel Info</h3>
            </div>
            <div class="travel_list">
              <!-- data-* 속성 : data-nearby-attractions-list | 동적 매핑 필요 -->
              <!-- li 내부: img=images[0].url, strong=title, p=description, em=images[0].description -->
              <ul data-nearby-attractions-list>
                <!-- li | 동적 매핑 필요 -->
              </ul>
            </div>
          </div>
        </section>
